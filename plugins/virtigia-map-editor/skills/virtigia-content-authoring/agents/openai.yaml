interface:
  display_name: "Virtigia – zawartość, itemy i analiza"
  short_description: "Questy, BaseItemy, grafiki i analiza Retro"
  default_prompt: "Use $virtigia-content-authoring to create or edit Virtigia content and BaseItems, inspect visual references, or analyze a Retro build through the Map Editor MCP."

dependencies:
  tools:
    - type: "mcp"
      value: "virtigia-map-editor"
      description: "Firmowe API Map Editora z logowaniem Virtigii"
      transport: "streamable_http"
      url: "https://map-editor.margatron.ovh/mcp/virtigia"

policy:
  allow_implicit_invocation: true
