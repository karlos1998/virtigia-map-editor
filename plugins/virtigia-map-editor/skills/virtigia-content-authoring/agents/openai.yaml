interface:
  display_name: "Virtigia – zawartość i analiza"
  short_description: "Questy, dialogi oraz analiza walk Retro"
  default_prompt: "Use $virtigia-content-authoring to work with Virtigia content or analyze a Retro combat build through the Map Editor MCP."

dependencies:
  tools:
    - type: "mcp"
      value: "virtigia-map-editor"
      description: "Firmowe API Map Editora z logowaniem Virtigii"
      transport: "streamable_http"
      url: "https://map-editor.margatron.ovh/mcp/virtigia"

policy:
  allow_implicit_invocation: true
